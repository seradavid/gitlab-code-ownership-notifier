# Pipeline for the ownership-notify component repository itself.
#
# This repository has two jobs in life:
#   1. publish the component (tagged semver + the engine image), and
#   2. run the weekly drift report (§7.2) that keeps CODEOWNERS honest.

stages:
  - test
  - build
  - drift
  - release
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  OWNERSHIP_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

default:
  image: python:3.11-slim
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip
  interruptible: true

# ------------------------------------------------------------------ test

test:
  stage: test
  script:
    - python -m pip install -e ".[dev]"
    - python -m pytest --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - report.xml
    reports:
      junit: report.xml

# Verify the component itself stays valid YAML with a resolvable input set.
lint-component:
  stage: test
  image: python:3.11-slim
  script:
    - python -m pip install pyyaml
    - python scripts/check_component.py templates/ownership-notify/template.yml .gitlab-ci.yml .github/workflows/ci.yml .github/workflows/release.yml

# Offline smoke test of the decision engine, no GitLab access needed.
smoke:
  stage: test
  script:
    - python -m pip install -e "."
    - ownership-bot --teams-file examples/teams.yml --codeowners-file examples/CODEOWNERS
      --changed-files-file examples/changed-files.txt --mr-json examples/mr.json
      --mode report --skip-upstream-check --json-out decision.json mr-check
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - decision.json

# ------------------------------------------------------------------ build

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"

# ------------------------------------------------------------------ drift

# Weekly governance report (§7.2). Scheduled in the UI (`CI_PIPELINE_SOURCE == "schedule"`)
# and always available as a manual job on the default branch.
drift-report:
  stage: drift
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - python -m pip install -e "."
    - ownership-bot --teams-file examples/teams.yml drift
      --group "$OWNERSHIP_GROUP" --ref "$OWNERSHIP_DRIFT_REF"
      --out-json drift-report.json --out-md drift-report.md
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - drift-report.json
      - drift-report.md

# ------------------------------------------------------------------ release

# A component version is a semver tag. `verify-release` re-runs the full suite against the
# tagged commit, so a published version can never point at something untested.
verify-release:
  stage: release
  image: python:3.11-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - python -m pip install -e ".[dev]"
    - python -m pytest
    - python scripts/check_component.py templates/ownership-notify/template.yml .gitlab-ci.yml
    # Whole-line quoting is required: an unquoted scalar containing ": " parses as a
    # mapping and GitLab rejects the job with "script config should be a string".
    - 'echo "Consumers reference it as:"'
    - 'echo "  include: component $CI_SERVER_FQDN/$CI_PROJECT_PATH/ownership-notify@$CI_COMMIT_TAG"'

# Publishing a release is what puts the version in the CI/CD Catalog, and GitLab only
# counts releases created by a job's `release` keyword — the Releases API does not work
# for this. The job needs an image that ships `glab` (or the legacy `release-cli`): the
# keyword shells out to it, and a plain python image fails with "release-cli: command
# not found". The project also has to be toggled on as a catalog project (Settings >
# General > Visibility), which is a one-time manual step.
create-release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - echo "Publishing $CI_COMMIT_TAG to the CI/CD Catalog"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "ownership-notify $CI_COMMIT_TAG — see CHANGELOG.md for what changed."
