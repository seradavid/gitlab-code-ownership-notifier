[project]
name = "ownership-bot"
version = "0.1.0"
description = "CODEOWNERS-driven ownership notifications for GitLab merge requests, delivered to Microsoft Teams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Sera" }]
keywords = [
    "gitlab",
    "codeowners",
    "code-ownership",
    "merge-request",
    "notifications",
    "teams",
    "ci-cd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ownership-bot = "ownership_bot.cli:main"

[project.urls]
Homepage = "https://github.com/seradavid/gitlab-code-ownership-notifier"
Documentation = "https://github.com/seradavid/gitlab-code-ownership-notifier/blob/master/docs/design.md"
Changelog = "https://github.com/seradavid/gitlab-code-ownership-notifier/blob/master/CHANGELOG.md"
Issues = "https://github.com/seradavid/gitlab-code-ownership-notifier/issues"
Security = "https://github.com/seradavid/gitlab-code-ownership-notifier/security/policy"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ownership_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["drafts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["ownership_bot"]

