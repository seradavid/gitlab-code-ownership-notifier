name: Release

# Tag a commit as vX.Y.Z to publish the container image to GHCR.
#
# A manual run is a dry run: it packages the project and checks that the tag matches the
# packaged version, and publishes nothing — the image needs a `vX.Y.Z` tag to be named.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: package the project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Nothing is uploaded to an index; building the distribution here keeps the
      # packaging metadata honest and gives the tag check below something to read.
      - run: python -m pip install build
      - run: python -m build
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          version = [p for p in pathlib.Path("dist").glob("*.whl")][0].name.split("-")[1]
          print(f"tag={tag} package={version}")
          sys.exit(0 if tag == version else f"tag {tag} does not match version {version}")
          PY

  publish-image:
    name: publish image to GHCR
    needs: build-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Point the GitLab component's `image` input at this tag, e.g.
      # ghcr.io/seradavid/gitlab-code-ownership-notifier:0.1.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
