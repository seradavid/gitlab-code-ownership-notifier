name: Release

# Tag a commit as vX.Y.Z to publish the package to PyPI and the image to GHCR.
#
# Required repository configuration:
#   * a PyPI trusted publisher for this repository and the `release` environment
#     (no API token is stored in the repository)
#   * the `release` environment, optionally with required reviewers

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish (leave unchecked for a dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-package:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          version = [p for p in pathlib.Path("dist").glob("*.whl")][0].name.split("-")[1]
          print(f"tag={tag} package={version}")
          sys.exit(0 if tag == version else f"tag {tag} does not match version {version}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-package:
    name: publish to PyPI
    needs: build-package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    environment:
      name: release
      url: https://pypi.org/p/ownership-bot
    permissions:
      id-token: write # trusted publishing, no API token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-image:
    name: publish image to GHCR
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Point the GitLab component's `image` input at this tag, e.g.
      # ghcr.io/seradavid/gitlab-code-ownership-notifier:0.1.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
