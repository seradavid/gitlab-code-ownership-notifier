name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest --junitxml=report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: report.xml

  component:
    name: CI/CD component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      # Catches the failure mode that breaks every consumer at include time:
      # an input referenced by a job but never declared under `spec.inputs`.
      - name: Lint the component template
        run: python scripts/check_component.py templates/ownership-notify/template.yml

  offline:
    name: offline end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      # The two jobs must run with no GitLab and no Teams: this is the demo in the
      # README, and it proves the engine has no hidden network dependency.
      - name: mr-check
        run: |
          ownership-bot \
            --teams-file examples/teams.yml \
            --codeowners-file examples/CODEOWNERS \
            --changed-files-file examples/changed-files.txt \
            --mr-json examples/mr.json \
            --mode report --skip-upstream-check \
            --json-out decision.json mr-check
      - name: merge-audit
        run: |
          ownership-bot \
            --teams-file examples/teams.yml \
            --codeowners-file examples/CODEOWNERS \
            --changed-files-file examples/changed-files.txt \
            --mr-json examples/mr.json --state merged \
            --mode report --json-out audit.json merge-audit
      - name: Both commands must have produced decisions
        run: |
          python - <<'PY'
          import json, sys
          checked = json.load(open("decision.json"))
          audited = json.load(open("audit.json"))
          print(f"mr-check: {len(checked['decisions'])} decision(s)")
          print(f"merge-audit: {len(audited['decisions'])} decision(s)")
          if not checked["decisions"] or not audited["decisions"]:
              sys.exit("expected a decision from both conditions")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-decisions
          path: |
            decision.json
            audit.json

  docker:
    name: build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ownership-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must actually run
        run: docker run --rm ownership-bot:ci --help
